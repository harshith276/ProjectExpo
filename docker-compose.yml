version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voltvision_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 9057grey@SQL
      POSTGRES_DB: volt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltvision_backend
    environment:
      - DATABASE_URL=postgresql://postgres:9057grey%40SQL@db:5432/volt_db
      - SECRET_KEY=production_secure_key_12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CURRENCY_CACHE_MINUTES=60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voltvision_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
